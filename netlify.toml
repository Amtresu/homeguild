[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  publish = "site"
  port = 8096
  targetPort = 0
  framework = "#static"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://*.arcgisonline.com; connect-src 'self' blob: https://services2.arcgis.com https://gis.idwr.idaho.gov https://photon.komoot.io https://cdn.jsdelivr.net; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; base-uri 'self'"
